<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0F172A" />

    <script>
      // Register Service Worker for PWA
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js");
        });
      }
    </script>
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-Y5WGXRFP8K"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-Y5WGXRFP8K");
    </script>

    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>Gold Vault Pro - Smart Gold Portfolio & Zakat Tracker</title>
    <meta
      name="description"
      content="Track your 999 and 916 gold investments with live market rates. Automated Zakat calculator, profit/loss tracking, and professional inventory reports."
    />
    <meta
      name="keywords"
      content="gold tracker, live gold price MYR, zakat calculator gold, gold investment app, 916 gold price, track gold portfolio"
    />
    <meta name="author" content="Gold Vault Pro" />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Gold Vault Pro - Live Gold & Zakat Tracker"
    />
    <meta
      property="og:description"
      content="Professional gold portfolio management with real-time price syncing and Zakat automation."
    />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&q=80&w=1000"
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/lucide-static@latest/font/lucide.css"
    />

    <style>
      @media print {
        body {
          background: white !important;
          color: black !important;
          padding: 40px !important;
        }
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        .vault-container {
          max-width: 100% !important;
          margin: 0 !important;
          box-shadow: none !important;
          border: none !important;
        }
        .report-header {
          margin-bottom: 30px;
        }
        .report-title {
          font-size: 24px;
          font-weight: 800;
          text-transform: uppercase;
          margin-bottom: 4px;
        }
        .report-date {
          font-size: 12px;
          color: #666;
          margin-bottom: 20px;
        }
        .report-divider {
          border-top: 1px solid #000;
          margin-bottom: 30px;
        }
        .report-table {
          width: 100%;
          border-collapse: collapse;
        }
        .report-table th {
          text-align: left;
          font-size: 10px;
          text-transform: uppercase;
          padding: 12px 0;
          border-bottom: none;
          color: #000;
          font-weight: 800;
        }
        .report-table td {
          padding: 12px 0;
          font-size: 11px;
          font-weight: 500;
          border-bottom: none;
        }
        .zakat-report-section {
          margin-top: 60px;
        }
        .zakat-title {
          font-size: 18px;
          font-weight: 800;
          margin-bottom: 10px;
        }
        .zakat-weight {
          font-size: 14px;
          margin-bottom: 10px;
          font-weight: 500;
        }
        .zakat-payable {
          font-size: 18px;
          font-weight: 800;
        }
      }
      .print-only {
        display: none;
      }
      @keyframes spin-once {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .sync-animate {
        animation: spin-once 0.5s ease-in-out;
      }

      /* Smooth UI Tweaks */
      body {
        -webkit-tap-highlight-color: transparent;
      }
      input[type="date"] {
        min-height: 1.5rem;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;
      const Icon = ({ name, size = 16, className = "" }) => (
        <i
          className={`icon-${name} ${className}`}
          style={{ fontSize: size }}
        ></i>
      );

      function GoldVaultPro() {
        const [items, setItems] = useState([]);
        const [showForm, setShowForm] = useState(false);
        const [showSettings, setShowSettings] = useState(false);
        const [showPortfolio, setShowPortfolio] = useState(false);
        const [showInventory, setShowInventory] = useState(false);
        const [showMarket, setShowMarket] = useState(false);

        const [isSyncing, setIsSyncing] = useState(false);
        const [editingId, setEditingId] = useState(null);
        const [expandedId, setExpandedId] = useState(null);
        const [costViewMode, setCostViewMode] = useState("perGram");

        const [currency, setCurrency] = useState("MYR");
        const [currentGoldPrice, setCurrentGoldPrice] = useState(390);
        const [highestPrice, setHighestPrice] = useState(0);
        const [targetPrice, setTargetPrice] = useState(450);
        const [lastSyncTime, setLastSyncTime] = useState(null);
        const [timeAgo, setTimeAgo] = useState("Syncing...");
        const [target999, setTarget999] = useState(50);
        const [target916, setTarget916] = useState(100);
        const [globalStoreOffset, setGlobalStoreOffset] = useState(50);
        const [zakatEnabled, setZakatEnabled] = useState(true);
        const [zakatPaid, setZakatPaid] = useState(false);

        const [formData, setFormData] = useState({
          name: "",
          type: "999",
          weight: "",
          purchasePrice: "",
          costMaking: "",
          goldPriceAtPurchase: "",
          totalPaid: "",
          purchaseDate: new Date().toISOString().split("T")[0],
        });

        const sym = currency === "MYR" ? "RM" : "$";
        const f2 = (val) =>
          Number(val).toLocaleString(undefined, {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          });
        const r2 = (val) =>
          Math.round((Number(val) + Number.EPSILON) * 100) / 100;

        const fetchRates = async () => {
          setIsSyncing(true);
          try {
            const [gRes, rRes] = await Promise.all([
              fetch("https://data-asg.goldprice.org/dbXRates/USD"),
              fetch("https://open.er-api.com/v6/latest/USD"),
            ]);
            const gData = await gRes.json();
            const rData = await rRes.json();
            const pricePerGramUSD = gData.items[0].xauPrice / 31.1035;
            const myrRate = rData.rates.MYR;
            const newPrice =
              currency === "MYR" ? pricePerGramUSD * myrRate : pricePerGramUSD;
            const roundedPrice = r2(newPrice);
            setCurrentGoldPrice(roundedPrice);
            setLastSyncTime(new Date().toISOString());
            setHighestPrice((prev) =>
              roundedPrice > prev ? roundedPrice : prev
            );
          } catch (e) {
            console.error("Sync Error", e);
          }
          setTimeout(() => setIsSyncing(false), 600);
        };

        const handleHardRefresh = async () => {
          if (
            confirm(
              "This will refresh the app to the latest version. Your saved data will NOT be deleted. Proceed?"
            )
          ) {
            // 1. Unregister all service workers
            if ("serviceWorker" in navigator) {
              const registrations =
                await navigator.serviceWorker.getRegistrations();
              for (let registration of registrations) {
                await registration.unregister();
              }
            }
            // 2. Clear the caches
            if ("caches" in window) {
              const cacheNames = await caches.keys();
              for (let name of cacheNames) {
                await caches.delete(name);
              }
            }
            // 3. Force reload from server
            window.location.reload(true);
          }
        };

        const handleFormChange = (field, value) => {
          let nextData = { ...formData, [field]: value };

          const p = Number(nextData.goldPriceAtPurchase) || 0;
          const w = Number(nextData.weight) || 0;
          const f = Number(nextData.costMaking) || 0;
          const t = Number(nextData.totalPaid) || 0;

          // Direction 1: Fee (costMaking) changed -> Update Total Paid
          if (field === "costMaking") {
            nextData.totalPaid = r2(p * w + Number(value));
          }

          // Direction 2: Gold Price/g changed -> Update Total Paid
          else if (field === "goldPriceAtPurchase") {
            nextData.totalPaid = r2(Number(value) * w + f);
          }

          // Direction 3: Total Paid changed -> Update Gold/g (New Requested Logic)
          else if (field === "totalPaid") {
            if (w > 0) {
              // Formula: (Total - Fee) / Weight
              nextData.goldPriceAtPurchase = r2((Number(value) - f) / w);
            }
          }

          // Helper: If weight changes, usually we update the Total Paid
          else if (field === "weight") {
            nextData.totalPaid = r2(p * Number(value) + f);
          }

          setFormData(nextData);
        };

        useEffect(() => {
          const saved = localStorage.getItem("gold-vault-v1");
          if (saved) {
            const d = JSON.parse(saved);
            setItems(d.items || []);
            setCurrency(d.currency || "MYR");
            setHighestPrice(r2(d.highestPrice) || 0);
            setTargetPrice(r2(d.targetPrice) || 450);
            setTarget999(d.target999 || 50);
            setTarget916(d.target916 || 100);
            setGlobalStoreOffset(r2(d.globalStoreOffset) || 50);
            setZakatEnabled(d.zakatEnabled ?? true);
            setZakatPaid(d.zakatPaid ?? false);
            if (d.lastSyncTime) setLastSyncTime(d.lastSyncTime);
          }
          fetchRates();
        }, []);

        useEffect(() => {
          localStorage.setItem(
            "gold-vault-v1",
            JSON.stringify({
              items,
              currency,
              currentGoldPrice,
              highestPrice,
              targetPrice,
              target999,
              target916,
              globalStoreOffset,
              lastSyncTime,
              zakatEnabled,
              zakatPaid,
            })
          );
        }, [
          items,
          currency,
          currentGoldPrice,
          highestPrice,
          targetPrice,
          target999,
          target916,
          globalStoreOffset,
          lastSyncTime,
          zakatEnabled,
          zakatPaid,
        ]);

        useEffect(() => {
          const interval = setInterval(() => {
            if (!lastSyncTime) return;
            const diff = Math.floor(
              (new Date() - new Date(lastSyncTime)) / 1000
            );
            if (diff < 10) setTimeAgo("Just now");
            else if (diff < 60) setTimeAgo(`${diff}s ago`);
            else setTimeAgo(`${Math.floor(diff / 60)}m ago`);
          }, 1000);
          return () => clearInterval(interval);
        }, [lastSyncTime]);

        const sortedItems = useMemo(() => {
          return [...items].sort(
            (a, b) => new Date(b.purchaseDate) - new Date(a.purchaseDate)
          );
        }, [items]);

        const totals = useMemo(() => {
          return items.reduce(
            (acc, i) => {
              const w = Number(i.weight);
              const rate =
                i.type === "916" ? currentGoldPrice * 0.916 : currentGoldPrice;
              const targetRate =
                i.type === "916" ? targetPrice * 0.916 : targetPrice;
              acc.val += rate * w;
              acc.targetVal += targetRate * w;
              acc.equivWeight += i.type === "916" ? w * 0.916 : w;
              if (i.type === "999") acc.w999 += w;
              else acc.w916 += w;
              acc.profit +=
                (rate - globalStoreOffset) * w - Number(i.purchasePrice);
              acc.targetProfit +=
                (targetRate - globalStoreOffset) * w - Number(i.purchasePrice);
              return acc;
            },
            {
              val: 0,
              targetVal: 0,
              profit: 0,
              targetProfit: 0,
              equivWeight: 0,
              w999: 0,
              w916: 0,
            }
          );
        }, [items, currentGoldPrice, targetPrice, globalStoreOffset]);

        const zakatValue =
          zakatEnabled && totals.equivWeight >= 85 ? totals.val * 0.025 : 0;

        const handleCurrencyToggle = async (newCurrency) => {
          if (newCurrency === currency) return;
          setIsSyncing(true);
          try {
            const res = await fetch("https://open.er-api.com/v6/latest/USD");
            const data = await res.json();
            const myrRate = data.rates.MYR;
            const factor = newCurrency === "MYR" ? myrRate : 1 / myrRate;
            setCurrentGoldPrice((prev) => r2(prev * factor));
            setHighestPrice((prev) => r2(prev * factor));
            setTargetPrice((prev) => r2(prev * factor));
            setGlobalStoreOffset((prev) => r2(prev * factor));
            setItems(
              items.map((item) => ({
                ...item,
                purchasePrice: r2(Number(item.purchasePrice) * factor),
                costMaking: r2(Number(item.costMaking) * factor),
                goldPriceAtPurchase: r2(
                  Number(item.goldPriceAtPurchase) * factor
                ),
              }))
            );
            setCurrency(newCurrency);
          } catch (e) {
            alert("Conversion failed.");
          }
          setIsSyncing(false);
        };

        const exportToString = () => {
          const data = JSON.stringify({
            items,
            currency,
            currentGoldPrice,
            highestPrice,
            targetPrice,
            target999,
            target916,
            globalStoreOffset,
            zakatEnabled,
            zakatPaid,
          });
          navigator.clipboard.writeText(btoa(data));
          alert("Vault Code Copied!");
        };

        const importFromString = () => {
          const code = prompt("Paste Vault Code:");
          if (!code) return;
          try {
            const decoded = JSON.parse(atob(code));
            setItems(decoded.items);
            setCurrency(decoded.currency);
            alert("Imported!");
          } catch (e) {
            alert("Invalid Code.");
          }
        };

        const highDiffPerc =
          highestPrice > 0
            ? (
                ((currentGoldPrice - highestPrice) / highestPrice) *
                100
              ).toFixed(2)
            : "0.00";

        return (
          <div className="max-w-md mx-auto min-h-screen pb-10 vault-container">
            {/* PDF REPORT */}
            <div className="print-only">
              <div className="report-header">
                <div className="report-title">Gold Vault Inventory Report</div>
                <div className="report-date">
                  Generated: {new Date().toLocaleString()}
                </div>
              </div>
              <div className="report-divider"></div>
              <table className="report-table">
                <thead>
                  <tr>
                    <th style={{ width: "15%" }}>Date</th>
                    <th style={{ width: "30%" }}>Asset</th>
                    <th style={{ width: "10%" }}>Type</th>
                    <th style={{ width: "15%" }}>Weight</th>
                    <th style={{ width: "15%" }}>Cost</th>
                    <th style={{ width: "15%" }}>Market Val</th>
                  </tr>
                </thead>
                <tbody>
                  {sortedItems.map((item) => (
                    <tr key={item.id}>
                      <td>{item.purchaseDate}</td>
                      <td style={{ textTransform: "uppercase" }}>
                        {item.name}
                      </td>
                      <td>{item.type}</td>
                      <td>{item.weight}g</td>
                      <td>
                        {sym} {f2(item.purchasePrice)}
                      </td>
                      <td>
                        {sym}{" "}
                        {f2(
                          (item.type === "916"
                            ? currentGoldPrice * 0.916
                            : currentGoldPrice) * item.weight
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div className="zakat-report-section">
                <div className="zakat-title">Zakat Declaration (2025)</div>
                <div className="zakat-weight">
                  999-Equivalent Total Weight: {totals.equivWeight.toFixed(3)}g
                </div>
                <div className="zakat-payable">
                  Total Zakat Payable: {currency} {f2(zakatValue)}
                </div>
              </div>
            </div>

            {/* APP UI */}
            <div className="no-print">
              <div className="bg-slate-900 text-white p-5 pb-24 rounded-b-[2.5rem] shadow-lg">
                <div className="flex justify-between items-center mb-6 text-slate-400 px-1">
                  <div className="flex items-center gap-2">
                    <span className="text-[9px] font-bold uppercase tracking-widest">
                      <Icon name="clock" size={10} /> {timeAgo}
                    </span>
                    <button
                      onClick={fetchRates}
                      className={`p-1 rounded-full bg-white/5 ${
                        isSyncing ? "sync-animate" : ""
                      }`}
                    >
                      <Icon name="refresh-cw" size={10} />
                    </button>
                  </div>
                  <h1 className="font-black text-lg uppercase italic tracking-tighter">
                    Gold Vault <span className="text-amber-400">PRO</span>
                  </h1>
                </div>
                <div className="grid grid-cols-2 gap-2 text-center">
                  <div className="bg-white/5 p-3 rounded-2xl border border-white/5">
                    <label className="text-[8px] uppercase font-bold text-slate-500 block mb-0.5">
                      Live 999 ({currency})
                    </label>
                    <div className="text-lg font-black tracking-tight">
                      {sym} {f2(currentGoldPrice)}
                    </div>
                    <div
                      className={`text-[10px] font-black ${
                        Number(highDiffPerc) >= 0
                          ? "text-emerald-400"
                          : "text-rose-400"
                      }`}
                    >
                      {Number(highDiffPerc) >= 0 ? "▲" : "▼"}{" "}
                      {Math.abs(highDiffPerc)}%
                    </div>
                  </div>
                  <div className="bg-white/5 p-3 rounded-2xl border border-white/5">
                    <label className="text-[8px] uppercase font-bold text-slate-500 block mb-0.5">
                      Live 916
                    </label>
                    <div className="text-lg font-black tracking-tight">
                      {sym} {f2(currentGoldPrice * 0.916)}
                    </div>
                  </div>
                  <div className="bg-white/5 p-3 rounded-2xl border border-white/5">
                    <label className="text-[8px] uppercase font-bold text-slate-500 block mb-0.5">
                      Record High
                    </label>
                    <div className="text-lg font-black text-emerald-400 leading-none mb-0.5">
                      {sym} {f2(highestPrice)}
                    </div>
                    <p className="text-[6px] text-slate-400 font-bold uppercase italic tracking-tighter">
                      Only record high when synced.
                    </p>
                  </div>
                  <div className="bg-white/5 p-3 rounded-2xl border border-white/5">
                    <label className="text-[8px] uppercase font-bold text-slate-500 block mb-0.5">
                      Goal Rank
                    </label>
                    <div className="text-lg font-black text-amber-400 italic">
                      {((currentGoldPrice / targetPrice) * 100).toFixed(1)}%
                    </div>
                  </div>
                </div>
              </div>

              <div className="bg-white mx-4 -mt-16 rounded-[2.5rem] p-6 shadow-2xl border border-slate-100 relative z-10">
                <button
                  onClick={() => setShowPortfolio(!showPortfolio)}
                  className="w-full flex justify-center items-center relative mb-1 px-1 group"
                >
                  <label className="text-[10px] uppercase font-bold text-slate-400 tracking-widest cursor-pointer group-hover:text-slate-600">
                    Portfolio Summary
                  </label>
                  <Icon
                    name={showPortfolio ? "chevron-up" : "chevron-down"}
                    size={14}
                    className="text-slate-300 absolute right-1"
                  />
                </button>

                {showPortfolio && (
                  <div className="pt-4 border-t border-slate-50 mt-2">
                    <div className="flex justify-between items-end border-b pb-4 border-slate-50">
                      <div>
                        <label className="text-[9px] font-bold text-slate-400 uppercase">
                          Real Value
                        </label>
                        <div className="text-xl font-black text-slate-900 leading-tight">
                          {sym} {f2(totals.val)}
                        </div>
                      </div>
                      <div className="text-right">
                        <label className="text-[9px] font-bold text-slate-400 uppercase">
                          True Profit
                        </label>
                        <div
                          className={`text-xl font-black leading-tight ${
                            totals.profit >= 0
                              ? "text-emerald-600"
                              : "text-rose-600"
                          }`}
                        >
                          {sym} {f2(totals.profit)}
                        </div>
                      </div>
                    </div>
                    <div className="flex justify-between items-center mt-3 text-slate-400 italic px-1 mb-6">
                      <div>
                        <label className="text-[9px] font-bold uppercase">
                          Forecast Value
                        </label>
                        <div className="text-sm font-black">
                          {sym} {f2(totals.targetVal)}
                        </div>
                      </div>
                      <div className="text-right">
                        <label className="text-[9px] font-bold uppercase">
                          Forecast Profit
                        </label>
                        <div className="text-sm font-black">
                          {sym} {f2(totals.targetProfit)}
                        </div>
                      </div>
                    </div>
                    <div className="space-y-4 mb-6">
                      <div>
                        <div className="flex justify-between text-[9px] font-black mb-1 uppercase text-slate-500">
                          <span>999 Target</span>
                          <span>
                            {totals.w999.toFixed(2)}g / {target999}g
                          </span>
                        </div>
                        <div className="h-2 bg-slate-100 rounded-full">
                          <div
                            className="h-full bg-amber-400 rounded-full transition-all"
                            style={{
                              width: `${Math.min(
                                (totals.w999 / target999) * 100,
                                100
                              )}%`,
                            }}
                          ></div>
                        </div>
                      </div>
                      <div>
                        <div className="flex justify-between text-[9px] font-black mb-1 uppercase text-slate-500">
                          <span>916 Target</span>
                          <span>
                            {totals.w916.toFixed(2)}g / {target916}g
                          </span>
                        </div>
                        <div className="h-2 bg-slate-100 rounded-full">
                          <div
                            className="h-full bg-orange-400 rounded-full transition-all"
                            style={{
                              width: `${Math.min(
                                (totals.w916 / target916) * 100,
                                100
                              )}%`,
                            }}
                          ></div>
                        </div>
                      </div>
                    </div>
                    {zakatEnabled && (
                      <div
                        className={`${
                          totals.equivWeight >= 85
                            ? zakatPaid
                              ? "bg-emerald-50 border-emerald-100"
                              : "bg-rose-50 border-rose-100 animate-pulse"
                            : "bg-slate-50"
                        } border p-4 rounded-2xl mb-6 flex justify-between items-center`}
                      >
                        <div>
                          <div className="text-[9px] font-black uppercase mb-1">
                            Zakat Requirement
                          </div>
                          <div
                            className={`text-lg font-black ${
                              zakatPaid
                                ? "text-emerald-600"
                                : totals.equivWeight >= 85
                                ? "text-rose-600"
                                : "text-slate-400"
                            }`}
                          >
                            {sym} {f2(zakatValue)}
                          </div>
                          <div className="text-[8px] font-bold text-slate-500 uppercase mt-1">
                            Total 999 Eqv: {totals.equivWeight.toFixed(3)}g /
                            85g
                          </div>
                        </div>
                        <Icon
                          name={
                            totals.equivWeight >= 85
                              ? zakatPaid
                                ? "check-circle"
                                : "alert-circle"
                              : "info"
                          }
                          size={20}
                          className={
                            zakatPaid ? "text-emerald-400" : "text-rose-300"
                          }
                        />
                      </div>
                    )}
                  </div>
                )}

                <button
                  onClick={() => {
                    setEditingId(null);
                    setFormData({
                      name: "",
                      type: "999",
                      weight: "",
                      purchasePrice: "",
                      costMaking: "",
                      goldPriceAtPurchase: "",
                      totalPaid: "",
                      purchaseDate: new Date().toISOString().split("T")[0],
                    });
                    setShowForm(true);
                  }}
                  className="w-full bg-slate-900 text-white font-black py-4 rounded-2xl flex items-center justify-center gap-2 text-sm uppercase mb-4 shadow-xl active:scale-95"
                >
                  <Icon name="plus-circle" size={18} /> New Entry
                </button>
                <button
                  onClick={() => setShowSettings(!showSettings)}
                  className="w-full text-slate-400 text-[10px] font-black flex items-center justify-center gap-2 uppercase tracking-widest mb-4"
                >
                  <Icon name="settings" size={12} /> Settings & Reports
                </button>

                {showSettings && (
                  <div className="p-5 bg-slate-50 rounded-3xl border border-slate-200 space-y-4 mb-4">
                    <div className="p-4 bg-white rounded-2xl border text-center">
                      <label className="text-[9px] font-black text-slate-400 uppercase block mb-2">
                        Vault Currency
                      </label>
                      <div className="flex gap-2">
                        <button
                          onClick={() => handleCurrencyToggle("MYR")}
                          className={`flex-1 py-2 rounded-xl text-[9px] font-black uppercase ${
                            currency === "MYR"
                              ? "bg-amber-400 text-slate-900 shadow-md"
                              : "bg-slate-100 text-slate-400"
                          }`}
                        >
                          MYR (RM)
                        </button>
                        <button
                          onClick={() => handleCurrencyToggle("USD")}
                          className={`flex-1 py-2 rounded-xl text-[9px] font-black uppercase ${
                            currency === "USD"
                              ? "bg-amber-400 text-slate-900 shadow-md"
                              : "bg-slate-100 text-slate-400"
                          }`}
                        >
                          USD ($)
                        </button>
                      </div>
                    </div>
                    <div className="p-4 bg-white rounded-2xl border text-center">
                      <label className="text-[9px] font-black text-slate-400 uppercase block mb-2">
                        Zakat Management
                      </label>
                      <div className="flex gap-2">
                        <button
                          onClick={() => setZakatEnabled(!zakatEnabled)}
                          className={`flex-1 py-2 rounded-xl text-[9px] font-black uppercase ${
                            zakatEnabled
                              ? "bg-slate-900 text-white"
                              : "bg-slate-200 text-slate-400"
                          }`}
                        >
                          {zakatEnabled ? "Active" : "Hidden"}
                        </button>
                        {zakatEnabled && (
                          <button
                            onClick={() => setZakatPaid(!zakatPaid)}
                            className={`flex-1 py-2 rounded-xl text-[9px] font-black uppercase ${
                              zakatPaid
                                ? "bg-emerald-500 text-white"
                                : "bg-slate-200 text-slate-400"
                            }`}
                          >
                            {zakatPaid ? "Paid" : "Due"}
                          </button>
                        )}
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[9px] font-black text-slate-400 block mb-1 uppercase">
                          Target Price
                        </label>
                        <input
                          type="number"
                          step="0.01"
                          className="w-full p-2.5 bg-white border rounded-xl text-sm font-bold"
                          value={r2(targetPrice)}
                          onChange={(e) => setTargetPrice(r2(e.target.value))}
                        />
                      </div>
                      <div>
                        <label className="text-[9px] font-black text-slate-400 block mb-1 uppercase">
                          Spread/Sell
                        </label>
                        <input
                          type="number"
                          step="0.01"
                          className="w-full p-2.5 bg-white border rounded-xl text-sm font-bold"
                          value={r2(globalStoreOffset)}
                          onChange={(e) =>
                            setGlobalStoreOffset(r2(e.target.value))
                          }
                        />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[9px] font-black text-rose-500 block mb-1 uppercase">
                          Record High
                        </label>
                        <input
                          type="number"
                          step="0.01"
                          className="w-full p-2.5 bg-white border border-rose-100 rounded-xl text-sm font-bold"
                          value={r2(highestPrice)}
                          onChange={(e) => setHighestPrice(r2(e.target.value))}
                        />
                      </div>
                      <div>
                        <label className="text-[9px] font-black text-slate-400 block mb-1 uppercase">
                          Goal 999 (g)
                        </label>
                        <input
                          type="number"
                          className="w-full p-2.5 bg-white border rounded-xl text-sm font-bold"
                          value={target999}
                          onChange={(e) => setTarget999(e.target.value)}
                        />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[9px] font-black text-slate-400 block mb-1 uppercase">
                          Goal 916 (g)
                        </label>
                        <input
                          type="number"
                          className="w-full p-2.5 bg-white border rounded-xl text-sm font-bold"
                          value={target916}
                          onChange={(e) => setTarget916(e.target.value)}
                        />
                      </div>
                      <div className="flex items-end">
                        <button
                          onClick={fetchRates}
                          className="w-full bg-white border p-2.5 rounded-xl text-[10px] font-black uppercase flex items-center justify-center gap-1 shadow-sm h-[42px]"
                        >
                          <Icon name="refresh-cw" size={12} /> Sync Rates
                        </button>
                      </div>
                    </div>
                    <div className="p-4 bg-indigo-50 rounded-2xl border border-indigo-100 flex gap-2">
                      <button
                        onClick={exportToString}
                        className="flex-1 bg-white border-2 border-indigo-200 p-2.5 rounded-xl text-[9px] font-black uppercase text-indigo-600"
                      >
                        Copy Code
                      </button>
                      <button
                        onClick={importFromString}
                        className="flex-1 bg-indigo-600 p-2.5 rounded-xl text-[9px] font-black uppercase text-white"
                      >
                        Paste Code
                      </button>
                    </div>
                    <button
                      onClick={() => window.print()}
                      className="w-full bg-slate-900 text-white p-3 rounded-xl text-[10px] font-black uppercase flex items-center justify-center gap-1 shadow-md mb-2"
                    >
                      <Icon name="file-down" size={12} /> PDF Report
                    </button>
                    <button
                      onClick={handleHardRefresh}
                      className="w-full mt-4 bg-slate-200 text-slate-600 p-3 rounded-xl text-[10px] font-black uppercase flex items-center justify-center gap-1 active:bg-slate-300"
                    >
                      <Icon name="refresh-cw" size={12} /> Force Update App
                    </button>
                  </div>
                )}
              </div>

              <div className="bg-white mx-4 mt-6 rounded-[2.5rem] p-6 shadow-xl border border-slate-100 mb-6">
                <button
                  onClick={() => setShowInventory(!showInventory)}
                  className="w-full flex justify-center items-center relative mb-1 px-1 group"
                >
                  <h3 className="text-[10px] font-black uppercase text-slate-400 tracking-widest cursor-pointer group-hover:text-slate-600">
                    Vault Inventory
                  </h3>
                  <Icon
                    name={showInventory ? "eye" : "eye-off"}
                    size={14}
                    className="text-slate-300 absolute right-1"
                  />
                </button>
                {showInventory && (
                  <div className="mt-4 space-y-3">
                    {sortedItems.length === 0 && (
                      <div className="text-center py-10 text-slate-300 text-[10px] uppercase font-bold tracking-widest">
                        No items in vault
                      </div>
                    )}
                    {sortedItems.map((item) => {
                      const rate =
                        item.type === "916"
                          ? currentGoldPrice * 0.916
                          : currentGoldPrice;
                      const prof =
                        (rate - globalStoreOffset) * item.weight -
                        Number(item.purchasePrice);
                      return (
                        <div
                          key={item.id}
                          className={`border rounded-[1.75rem] shadow-sm overflow-hidden transition-all ${
                            prof >= 0
                              ? "bg-emerald-50/60 border-emerald-100"
                              : "bg-rose-50/60 border-rose-100"
                          }`}
                        >
                          <div
                            onClick={() =>
                              setExpandedId(
                                expandedId === item.id ? null : item.id
                              )
                            }
                            className="p-5 flex justify-between items-center cursor-pointer"
                          >
                            <div>
                              <div className="text-[7px] font-black text-slate-400 uppercase mb-0.5">
                                {item.purchaseDate}
                              </div>
                              <div className="font-black text-slate-800 uppercase text-[11px] mb-1">
                                {item.name}
                              </div>
                              <div className="text-[10px] font-bold text-slate-400">
                                {item.weight}g · {item.type}
                              </div>
                            </div>
                            <div className="text-right">
                              <div className="font-black text-base text-slate-900">
                                {sym} {f2(rate * item.weight)}
                              </div>
                              <div
                                className={`text-[10px] font-bold ${
                                  prof >= 0
                                    ? "text-emerald-600"
                                    : "text-rose-600"
                                }`}
                              >
                                {sym} {f2(prof)}
                              </div>
                            </div>
                          </div>
                          {expandedId === item.id && (
                            <div className="p-4 pt-0 border-t border-black/5 bg-slate-50/50">
                              <div
                                className="grid grid-cols-3 gap-2 py-4 cursor-pointer"
                                onClick={() =>
                                  setCostViewMode(
                                    costViewMode === "perGram"
                                      ? "total"
                                      : "perGram"
                                  )
                                }
                              >
                                <div className="bg-white p-2 rounded-xl border border-slate-100 shadow-sm relative">
                                  <label className="text-[7px] uppercase font-bold text-slate-400 block mb-1 text-center">
                                    {costViewMode === "perGram"
                                      ? "Price/g"
                                      : "Total Gold"}
                                  </label>
                                  <div className="text-[11px] font-black text-center text-slate-800">
                                    {sym}{" "}
                                    {costViewMode === "perGram"
                                      ? f2(item.goldPriceAtPurchase)
                                      : f2(
                                          Number(item.goldPriceAtPurchase) *
                                            Number(item.weight)
                                        )}
                                  </div>
                                </div>
                                <div className="bg-white p-2 rounded-xl border border-slate-100 shadow-sm text-rose-500 relative">
                                  <label className="text-[7px] uppercase font-bold text-slate-400 block mb-1 text-center">
                                    Fee
                                  </label>
                                  <div className="text-[11px] font-black text-center">
                                    {sym}{" "}
                                    {costViewMode === "perGram"
                                      ? f2(
                                          Number(item.costMaking) /
                                            Number(item.weight)
                                        )
                                      : f2(item.costMaking)}
                                  </div>
                                </div>
                                <div className="bg-slate-900 p-2 rounded-xl border border-slate-900 shadow-sm text-white">
                                  <label className="text-[7px] uppercase font-bold text-slate-300 block mb-1 text-center">
                                    Paid
                                  </label>
                                  <div className="text-[11px] font-black text-center italic">
                                    {sym} {f2(item.purchasePrice)}
                                  </div>
                                </div>
                              </div>
                              <div className="flex gap-2">
                                <button
                                  onClick={() => {
                                    setEditingId(item.id);
                                    setFormData(item);
                                    setShowForm(true);
                                  }}
                                  className="flex-1 bg-white border py-2 rounded-xl text-[10px] font-black uppercase shadow-sm"
                                >
                                  Edit
                                </button>
                                <button
                                  onClick={() => {
                                    const newItem = {
                                      ...item,
                                      id: Date.now(),
                                      name: `${item.name} (Copy)`,
                                    };
                                    setItems([newItem, ...items]);
                                  }}
                                  className="flex-1 bg-white border py-2 rounded-xl text-[10px] font-black uppercase shadow-sm"
                                >
                                  Duplicate
                                </button>
                                <button
                                  onClick={() =>
                                    setItems(
                                      items.filter((i) => i.id !== item.id)
                                    )
                                  }
                                  className="flex-1 bg-rose-50 text-rose-600 border border-rose-200 py-2 rounded-xl text-[10px] font-black uppercase"
                                >
                                  Del
                                </button>
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              <div className="bg-white mx-4 mt-4 rounded-[2.5rem] shadow-xl border border-slate-100 overflow-hidden mb-10">
                <button
                  onClick={() => setShowMarket(!showMarket)}
                  className="w-full p-6 flex flex-col justify-center items-center bg-white group"
                >
                  <h3 className="text-[10px] font-black uppercase text-slate-400 tracking-widest group-hover:text-slate-600 mb-1">
                    Market History (Chart)
                  </h3>
                  <Icon
                    name={showMarket ? "chevron-up" : "chevron-down"}
                    size={14}
                    className="text-slate-300"
                  />
                </button>
                {showMarket && (
                  <div className="w-full h-[300px] border-t border-slate-50">
                    <iframe
                      src="https://s.tradingview.com/widgetembed/?symbol=FX_IDC%3AXAUUSDG&interval=D&hidesidetoolbar=1&theme=light"
                      style={{ width: "100%", height: "100%", border: "none" }}
                    ></iframe>
                  </div>
                )}
              </div>
            </div>

            {showForm && (
              <div className="fixed inset-0 bg-slate-900/90 z-[100] flex items-end sm:items-center justify-center p-0 backdrop-blur-sm">
                <div className="bg-white w-full max-w-md rounded-t-[3rem] p-8 shadow-2xl">
                  <div className="flex justify-between items-center mb-6">
                    <h2 className="font-black text-xl uppercase tracking-tighter">
                      {editingId ? "Edit Entry" : "Gold Entry"}
                    </h2>
                    <button
                      onClick={() => setShowForm(false)}
                      className="bg-slate-100 p-2 rounded-full"
                    >
                      <Icon name="x" size={20} />
                    </button>
                  </div>
                  <div className="space-y-4">
                    <input
                      className="w-full p-4 bg-slate-50 rounded-2xl font-bold border-2 border-transparent focus:border-slate-200 outline-none uppercase text-sm"
                      placeholder="Asset Name"
                      value={formData.name}
                      onChange={(e) =>
                        setFormData({ ...formData, name: e.target.value })
                      }
                    />
                    <div className="grid grid-cols-2 gap-4">
                      <div className="bg-slate-50 rounded-2xl p-4">
                        <label className="text-[8px] font-black text-slate-400 block mb-1 uppercase">
                          Purchase Date
                        </label>
                        <input
                          type="date"
                          className="bg-transparent font-bold outline-none text-sm w-full"
                          value={formData.purchaseDate}
                          onChange={(e) =>
                            setFormData({
                              ...formData,
                              purchaseDate: e.target.value,
                            })
                          }
                        />
                      </div>
                      <select
                        className="p-4 bg-slate-50 rounded-2xl font-bold outline-none text-sm"
                        value={formData.type}
                        onChange={(e) =>
                          setFormData({ ...formData, type: e.target.value })
                        }
                      >
                        <option value="999">Type: 999</option>
                        <option value="916">Type: 916</option>
                      </select>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                      <input
                        type="number"
                        className="p-4 bg-slate-50 rounded-2xl font-bold outline-none text-sm"
                        placeholder="Weight (g)"
                        value={formData.weight}
                        onChange={(e) =>
                          handleFormChange("weight", e.target.value)
                        }
                      />
                      <input
                        type="number"
                        step="0.01"
                        className="p-4 bg-slate-50 rounded-2xl font-black text-sm"
                        placeholder="Price /g"
                        value={formData.goldPriceAtPurchase}
                        onChange={(e) =>
                          handleFormChange(
                            "goldPriceAtPurchase",
                            e.target.value
                          )
                        }
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="text-[9px] font-black text-slate-400 ml-2 mb-1 block uppercase">
                          Fee Making
                        </label>
                        <input
                          type="number"
                          step="0.01"
                          className="w-full p-4 bg-slate-50 rounded-2xl font-black text-sm"
                          value={formData.costMaking}
                          onChange={(e) =>
                            handleFormChange("costMaking", e.target.value)
                          }
                        />
                      </div>
                      <div>
                        <label className="text-[9px] font-black text-slate-400 ml-2 mb-1 block uppercase">
                          Total Paid
                        </label>
                        <input
                          type="number"
                          step="0.01"
                          className="w-full p-4 bg-slate-100 rounded-2xl font-black text-sm border-2 border-slate-200"
                          value={formData.totalPaid}
                          onChange={(e) =>
                            handleFormChange("totalPaid", e.target.value)
                          }
                        />
                      </div>
                    </div>
                    <button
                      onClick={() => {
                        const finalPrice = Number(formData.totalPaid);
                        const entry = {
                          ...formData,
                          purchasePrice: r2(finalPrice),
                          id: editingId || Date.now(),
                        };
                        if (editingId)
                          setItems(
                            items.map((i) => (i.id === editingId ? entry : i))
                          );
                        else setItems([entry, ...items]);
                        setShowForm(false);
                      }}
                      className="w-full bg-slate-900 text-white font-black py-5 rounded-2xl uppercase shadow-xl mt-4"
                    >
                      Save Entry
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<GoldVaultPro />);
    </script>
  </body>
</html>
